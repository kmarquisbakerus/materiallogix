name: Audit available secret names
on:
  push:
    paths: ['.github/workflows/audit-available-secret-names.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret names only
        env:
          SECRET_CONTEXT: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          names = sorted(json.loads(os.environ.get('SECRET_CONTEXT', '{}')).keys())
          print('AVAILABLE_SECRET_NAMES=' + ','.join(names))
          PY
