name: Publish and verify approved LibraSide site

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - '.github/workflows/publish-libraside-via-git-integration.yml'
      - 'company-site/**'
      - 'wrangler.libraside.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libraside-production-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the approved corporate-site branch
        uses: actions/checkout@v5

      - name: Validate the approved static website
        shell: bash
        run: |
          set -euo pipefail
          test -f company-site/index.html
          test -f company-site/styles.css
          test -f company-site/site.js
          test -f company-site/.assetsignore
                    test -f company-site/media/studio-founder-review-actual.webp
          test -f company-site/media/studio-founder-review-actual.webp
          test -f company-site/media/sideof-group-chat-actual.webp
          test -f company-site/media/evidence-manifest.json
          test -f wrangler.libraside.jsonc
          node -e "JSON.parse(require('fs').readFileSync('wrangler.libraside.jsonc', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('company-site/media/evidence-manifest.json', 'utf8'))"
          grep -Fq 'Technology<br> with boundaries.' company-site/index.html
          grep -Fq 'Proof before promise.' company-site/index.html
          grep -Fq 'studio-founder-review-actual.webp' company-site/index.html
          grep -Fq 'Actual product interface' company-site/index.html
          grep -Fq 'fictional demo data' company-site/index.html
          grep -Fq 'LibraSide Technologies LLC' company-site/index.html
          if grep -Eiq 'beforeinstallprompt|serviceWorker|manifest\.json|add to home screen' company-site/index.html company-site/site.js; then
            echo '::error::Web-app installation behavior is not permitted on this corporate website.'
            exit 1
          fi
          # The founder's full legal name belongs in executed corporate records.
          if grep -Fq 'Illustrative' company-site/index.html; then
            echo '::error::Every image on this site is a real product capture. Staged scenes are not permitted.'
            exit 1
          fi
          if grep -Fq 'Kevin Marquis Baker' company-site/index.html; then
            echo '::error::The founder middle name must not appear on a public page.'
            exit 1
          fi
          # No equity, note or fundraising ask is authorised on a public surface.
          if grep -Eiq '>[^<]*\b(investment|investors?|fundrais|valuation)\b' company-site/index.html; then
            echo '::error::A financing ask is not authorised on this site.'
            exit 1
          fi

      - name: Publish through Workers static assets
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Without credentials this job cannot publish, but it can still say
          # whether production matches this branch, which is worth knowing when
          # someone deploys by hand. So it drops to a drift check and records
          # which mode it ran in, and the verify step reports the difference:
          # a mismatch here means unpublished, not broken.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::warning::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets, so this job cannot publish. Running a drift check against production instead.'
            echo 'executed=false' >> "$GITHUB_OUTPUT"
            echo 'mode=drift-check-only' >> "$GITHUB_OUTPUT"
          else
            npx --yes wrangler@4.128.0 deploy --config wrangler.libraside.jsonc
            echo 'executed=true' >> "$GITHUB_OUTPUT"
            echo 'mode=deployed-and-verified' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the public root and www domains
        shell: bash
        run: |
          set -euo pipefail
          expected_hash="$(sha256sum company-site/index.html | awk '{print $1}')"
          normalize_hosted_html() {
            python - "$1" "$2" <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          body = source.read_bytes()
          beacon = re.compile(
              rb'(?m)^<script type="module" src="https://static\.cloudflareinsights\.com/'
              rb'beacon\.min\.js/[^"]+" integrity="sha512-[^"]+" data-cf-beacon='
              rb"'[^']+' crossorigin=\"anonymous\"></script>\r?\n?"
          )
          matches = beacon.findall(body)
          if len(matches) > 1:
              raise SystemExit('More than one hosting analytics beacon was injected.')
          target.write_bytes(beacon.sub(b'', body))
          PY
          }
          verify() {
            local url="$1"
            local body=/tmp/verify.html
            local normalized=/tmp/verify-source.html
            for attempt in $(seq 1 120); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${url}?publish_verify=${GITHUB_RUN_ID}-${attempt}" > "$body" 2>/tmp/curl-error.txt \
                && grep -Fq 'Technology<br> with boundaries.' "$body" \
                && grep -Fq 'Proof before promise.' "$body" \
                && grep -Fq 'studio-founder-review-actual.webp' "$body" \
                && grep -Fq 'Actual product interface' "$body" \
                && grep -Fq 'fictional demo data' "$body" \
                && grep -Fq 'LibraSide Technologies LLC' "$body" \
                && normalize_hosted_html "$body" "$normalized" \
                && [ "$(sha256sum "$normalized" | awk '{print $1}')" = "$expected_hash" ]; then
                echo "$url serves the approved LibraSide website with no content changes beyond the permitted hosting analytics beacon."
                return 0
              fi
              sleep 10
            done
            if [ '${{ steps.deploy.outputs.executed }}' = 'false' ]; then
              echo "::error::$url does not serve this branch, and this job has no credentials to publish it. The site is unpublished, not broken: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or deploy by hand."
            else
              echo "::error::$url did not serve the exact approved website during the verification window after a deploy ran."
            fi
            sed -n '1,20p' /tmp/curl-error.txt || true
            return 1
          }
          verify 'https://librasidetechnologies.com/'
          verify 'https://www.librasidetechnologies.com/'

      - name: Record successful publication
        if: success()
        shell: bash
        run: |
          cat > publication-result.json <<JSON
          {
            "status": "published-and-verified",
            "sourceCommit": "${GITHUB_SHA}",
            "deploymentExecuted": "${{ steps.deploy.outputs.executed }}",
            "deploymentMode": "${{ steps.deploy.outputs.mode }}",
            "hostingTarget": "libraside-technologies-site",
            "root": "https://librasidetechnologies.com/",
            "www": "https://www.librasidetechnologies.com/",
            "verifiedAt": "$(date -u +%FT%TZ)"
          }
          JSON
          cat publication-result.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libraside-publication-evidence
          path: |
            publication-result.json
            /tmp/verify.html
            /tmp/verify-source.html
            /tmp/curl-error.txt
          if-no-files-found: warn
          retention-days: 7
