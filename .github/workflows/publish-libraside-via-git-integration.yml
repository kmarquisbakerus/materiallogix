name: Publish and verify approved LibraSide site

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - '.github/workflows/publish-libraside-via-git-integration.yml'
      - 'company-site/**'
      - 'wrangler.libraside.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libraside-production-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the approved corporate-site branch
        uses: actions/checkout@v5

      - name: Validate the approved static website
        shell: bash
        run: |
          set -euo pipefail
          test -f company-site/index.html
          test -f company-site/styles.css
          test -f company-site/site.js
          test -f company-site/.assetsignore
          test -f company-site/media/studio-video-interface-actual.webp
          test -f company-site/media/studio-voice-interface-actual.webp
          test -f company-site/media/sideof-home-actual.webp
          test -f company-site/media/sideof-approximate-map-current.png
          test -f company-site/media/evidence-manifest.json
          test -f wrangler.libraside.jsonc
          node -e "JSON.parse(require('fs').readFileSync('wrangler.libraside.jsonc', 'utf8'))"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('company-site/media/evidence-manifest.json', 'utf8'));
          const expectedFiles = [
            'sideof-approximate-map-current.png',
            'sideof-home-actual.webp',
            'studio-video-interface-actual.webp',
            'studio-voice-interface-actual.webp'
          ].sort();
          const actualFiles = manifest.assets.map(asset => asset.file).sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            throw new Error('The evidence manifest does not match the approved public media set.');
          }
          for (const asset of manifest.assets) {
            const file = path.join('company-site', 'media', asset.file);
            const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (digest !== asset.sha256) throw new Error(`Evidence hash mismatch: ${asset.file}`);
          }
          NODE
          grep -Fq 'For what you make.<br>For how you connect.' company-site/index.html
          grep -Fq 'A DC-founded technology company' company-site/index.html
          grep -Fq 'Source / generated' company-site/index.html
          grep -Fq 'Package + deliver' company-site/index.html
          grep -Fq 'Camera RAW qualification and external delivery integrations remain in progress' company-site/index.html
          grep -Fq 'Actual product interface' company-site/index.html
          grep -Fq 'Fictional demonstration data' company-site/index.html
          grep -Fq 'Local-first direction' company-site/index.html
          grep -Fq 'verified short-lived controls before release' company-site/index.html
          grep -Fq 'MaterialLogix Builder' company-site/index.html
          grep -Fq 'In development' company-site/index.html
          grep -Fq 'Coming soon' company-site/index.html
          grep -Fq 'Kevin Baker' company-site/index.html
          grep -Fq 'LibraSide Technologies LLC' company-site/index.html
          grep -Fq 'media/evidence-manifest.json' company-site/.assetsignore
          test ! -e company-site/media/founder-kevin-baker.webp
          test ! -e company-site/media/libraside-investor-hero.webp
          test ! -e company-site/media/libraside-investor-hero-proof.webp
          test ! -e company-site/media/sideof-founder-connection.webp
          test ! -e company-site/media/studio-kevin-approved-current.png
          test ! -e company-site/media/studio-kevin-review-current.png
          test ! -e company-site/media/materiallogix-fashion-design-canvas-current.png
          if grep -Eiq 'Kevin Marquis|Douglass|artificial intelligence|AI-generated|Proof before promise|Technology<br> with boundaries' company-site/index.html; then
            echo '::error::Retired name, product, or campaign language remains in the public page.'
            exit 1
          fi
          if grep -Eiq 'beforeinstallprompt|serviceWorker|manifest\.json|add to home screen' company-site/index.html company-site/site.js; then
            echo '::error::Web-app installation behavior is not permitted on this corporate website.'
            exit 1
          fi

      - name: Publish through Workers static assets when credentials are configured
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            npx --yes wrangler@4.128.0 deploy --config wrangler.libraside.jsonc
            echo 'executed=true' >> "$GITHUB_OUTPUT"
            echo 'mode=deployed-and-verified' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Cloudflare deployment credentials are not configured; running verification-only. This job will fail if production differs from the approved source.'
            echo 'executed=false' >> "$GITHUB_OUTPUT"
            echo 'mode=verified-existing-production' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the public root and www domains
        shell: bash
        run: |
          set -euo pipefail
          expected_hash="$(sha256sum company-site/index.html | awk '{print $1}')"
          normalize_hosted_html() {
            python - "$1" "$2" <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          body = source.read_bytes()
          beacon = re.compile(
              rb'(?m)^<script type="module" src="https://static\.cloudflareinsights\.com/'
              rb'beacon\.min\.js/[^"]+" integrity="sha512-[^"]+" data-cf-beacon='
              rb"'[^']+' crossorigin=\"anonymous\"></script>\r?\n?"
          )
          matches = beacon.findall(body)
          if len(matches) > 1:
              raise SystemExit('More than one hosting analytics beacon was injected.')
          target.write_bytes(beacon.sub(b'', body))
          PY
          }
          verify() {
            local url="$1"
            local body=/tmp/verify.html
            local normalized=/tmp/verify-source.html
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${url}?publish_verify=${GITHUB_RUN_ID}-${attempt}" > "$body" 2>/tmp/curl-error.txt \
                && grep -Fq 'For what you make.<br>For how you connect.' "$body" \
                && grep -Fq 'A DC-founded technology company' "$body" \
                && grep -Fq 'Source / generated' "$body" \
                && grep -Fq 'Package + deliver' "$body" \
                && grep -Fq 'Camera RAW qualification and external delivery integrations remain in progress' "$body" \
                && grep -Fq 'Actual product interface' "$body" \
                && grep -Fq 'Fictional demonstration data' "$body" \
                && grep -Fq 'Local-first direction' "$body" \
                && grep -Fq 'verified short-lived controls before release' "$body" \
                && grep -Fq 'MaterialLogix Builder' "$body" \
                && grep -Fq 'In development' "$body" \
                && grep -Fq 'Coming soon' "$body" \
                && grep -Fq 'Kevin Baker' "$body" \
                && grep -Fq 'LibraSide Technologies LLC' "$body" \
                && normalize_hosted_html "$body" "$normalized" \
                && [ "$(sha256sum "$normalized" | awk '{print $1}')" = "$expected_hash" ]; then
                echo "$url serves the approved LibraSide website with no content changes beyond the permitted hosting analytics beacon."
                return 0
              fi
              sleep 10
            done
            echo "::error::$url did not serve the exact approved website during the verification window."
            sed -n '1,20p' /tmp/curl-error.txt || true
            return 1
          }
          verify_assets() {
            local base="$1"
            local path
            local expected
            local actual
            for path in \
              styles.css \
              site.js \
              media/sideof-approximate-map-current.png \
              media/sideof-home-actual.webp \
              media/studio-video-interface-actual.webp \
              media/studio-voice-interface-actual.webp; do
              expected="$(sha256sum "company-site/$path" | awk '{print $1}')"
              actual="$(curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${base}${path}?publish_verify=${GITHUB_RUN_ID}" | sha256sum | awk '{print $1}')"
              if [ "$actual" != "$expected" ]; then
                echo "::error::${base}${path} does not match the approved source asset."
                return 1
              fi
            done
          }
          verify 'https://librasidetechnologies.com/'
          verify_assets 'https://librasidetechnologies.com/'
          verify 'https://www.librasidetechnologies.com/'
          verify_assets 'https://www.librasidetechnologies.com/'

      - name: Record successful publication
        if: success()
        shell: bash
        run: |
          cat > publication-result.json <<JSON
          {
            "status": "published-and-verified",
            "sourceCommit": "${GITHUB_SHA}",
            "deploymentExecuted": "${{ steps.deploy.outputs.executed }}",
            "deploymentMode": "${{ steps.deploy.outputs.mode }}",
            "hostingTarget": "libraside-technologies-site",
            "root": "https://librasidetechnologies.com/",
            "www": "https://www.librasidetechnologies.com/",
            "verifiedAt": "$(date -u +%FT%TZ)"
          }
          JSON
          cat publication-result.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libraside-publication-evidence
          path: |
            publication-result.json
            /tmp/verify.html
            /tmp/verify-source.html
            /tmp/curl-error.txt
          if-no-files-found: warn
          retention-days: 7
