name: Published site integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prices, service worker, links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify every script parses
        run: |
          set -e
          for file in $(git ls-files '*.js' '*.mjs'); do
            node --check "$file"
          done

      - name: Verify published site integrity
        run: node scripts/check-site.mjs
