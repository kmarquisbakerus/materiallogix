name: CodeQL alert list (probe)

# Temporary: runs the same analysis the CodeQL check runs, keeps the SARIF
# instead of uploading it, and prints every result to the job log. The security
# tab is not readable from this session, and a fix written without the rule ids
# and locations would be a guess.

on:
  push:
    branches: [claude/codeql-sarif-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: List CodeQL results
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: false

      - name: Print every result
        run: |
          python3 - <<'PY'
          import glob, json
          for path in sorted(glob.glob('sarif-results/*.sarif')):
              data = json.load(open(path))
              for run in data.get('runs', []):
                  rules = {r['id']: r for r in run['tool']['driver'].get('rules', [])}
                  extensions = run['tool'].get('extensions', [])
                  for ext in extensions:
                      for r in ext.get('rules', []):
                          rules.setdefault(r['id'], r)
                  results = run.get('results', [])
                  print(f'== {path}: {len(results)} results')
                  for res in results:
                      rid = res.get('ruleId', '?')
                      rule = rules.get(rid, {})
                      props = rule.get('properties', {})
                      sev = props.get('security-severity', '')
                      loc = res['locations'][0]['physicalLocation']
                      uri = loc['artifactLocation']['uri']
                      line = loc['region'].get('startLine')
                      msg = res['message']['text'].replace('\n', ' ')
                      print(f'[{sev or "-"}] {rid} :: {uri}:{line} :: {msg}')
                      for flow in res.get('codeFlows', [])[:1]:
                          for tf in flow.get('threadFlows', []):
                              for step in tf.get('locations', []):
                                  p = step['location']['physicalLocation']
                                  print(f'      <- {p["artifactLocation"]["uri"]}:{p["region"].get("startLine")}'
                                        f' {step["location"].get("message", {}).get("text", "")}')
          PY
