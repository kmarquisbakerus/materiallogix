name: Apply Libra Side Technologies visual redesign

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - .github/workflows/apply-company-site-redesign.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: company/libraside-technologies
      - name: Replace the preserved company-site source
        shell: bash
        env:
          SITE_ARCHIVE_B64: 
        run: |
          set -euo pipefail
          rm -rf company-site
          mkdir -p company-site
          printf '%s' "$SITE_ARCHIVE_B64" | base64 --decode > /tmp/libraside-site.tgz
          tar -xzf /tmp/libraside-site.tgz -C company-site
          rm -f .github/workflows/apply-company-site-redesign.yml
      - name: Commit the visual redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company-site .github/workflows/apply-company-site-redesign.yml
          git commit -m "Replace the Libra Side corporate site visual system"
          git push origin HEAD:company/libraside-technologies
