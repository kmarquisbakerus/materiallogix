name: Enable Libra Side deploy credential fallback

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - .github/workflows/enable-libraside-deploy-credential-fallback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: company/libraside-technologies
      - name: Allow the existing Cloudflare token fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-libraside.yml')
          source = path.read_text(encoding='utf-8')
          dollar = chr(36)
          primary_expression = dollar + '{{ secrets.CLOUDFLARE_API_TOKEN }}'
          fallback_expression = dollar + '{{ secrets.CLOUDFLARE_R2_API_TOKEN }}'
          old_env = f'      CLOUDFLARE_API_TOKEN: {primary_expression}'
          new_env = '\n'.join([
              f'      PRIMARY_CLOUDFLARE_API_TOKEN: {primary_expression}',
              f'      FALLBACK_CLOUDFLARE_API_TOKEN: {fallback_expression}',
          ])
          old_verify = '\n'.join([
              '          test -n "$CLOUDFLARE_API_TOKEN" || {',
              "            echo '::error::CLOUDFLARE_API_TOKEN is not available to this repository.'",
              '            exit 1',
              '          }',
              '          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H \'Content-Type: application/json\')',
          ])
          new_verify = '\n'.join([
              '          token="${PRIMARY_CLOUDFLARE_API_TOKEN:-${FALLBACK_CLOUDFLARE_API_TOKEN:-}}"',
              '          test -n "$token" || {',
              "            echo '::error::Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_R2_API_TOKEN is available to this repository.'",
              '            exit 1',
              '          }',
              '          echo "::add-mask::$token"',
              '          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"',
              '          auth=(-H "Authorization: Bearer $token" -H \'Content-Type: application/json\')',
          ])
          if source.count(old_env) != 1:
              raise SystemExit('deploy workflow credential line changed; refusing an unsafe blind edit')
          if source.count(old_verify) != 1:
              raise SystemExit('deploy workflow verification block changed; refusing an unsafe blind edit')
          source = source.replace(old_env, new_env, 1).replace(old_verify, new_verify, 1)
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/enable-libraside-deploy-credential-fallback.yml').unlink(missing_ok=True)
          PY
      - name: Commit the credential selection fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-libraside.yml .github/workflows/enable-libraside-deploy-credential-fallback.yml
          git diff --cached --quiet && exit 0
          git commit -m "Allow existing Cloudflare deploy token fallback"
          git push origin HEAD:company/libraside-technologies
