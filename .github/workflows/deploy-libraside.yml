name: Deploy Libra Side Technologies

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - 'company-site/**'
      - '.github/workflows/deploy-libraside.yml'
  workflow_dispatch:

concurrency:
  group: libraside-technologies-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 14dc84dbb0fe90fa20b86a565d4b2d70
  PROJECT_NAME: libraside-technologies
  COMPANY_DOMAIN: librasidetechnologies.com
  COMPANY_WWW_DOMAIN: www.librasidetechnologies.com
  COMPANY_EMAIL: kevinbaker@librasidetechnologies.com
  DESTINATION_EMAIL: kmarquisbaker@gmail.com

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require and verify Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo '::error::CLOUDFLARE_API_TOKEN is not available to this repository.'
            exit 1
          }
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          verification="$(curl --fail --silent --show-error "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true' <<<"$verification" >/dev/null

      - name: Resolve the company zone
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          response="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$COMPANY_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50")"
          jq -e '.success == true' <<<"$response" >/dev/null
          zone_id="$(jq -r '.result[0].id // empty' <<<"$response")"
          test -n "$zone_id" || {
            echo "::error::The Cloudflare account cannot see the $COMPANY_DOMAIN zone."
            exit 1
          }
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Create Pages project if needed
        shell: bash
        run: npx -y wrangler@4 pages project create "$PROJECT_NAME" --production-branch company/libraside-technologies || true

      - name: Deploy company site
        shell: bash
        run: npx -y wrangler@4 pages deploy company-site --project-name "$PROJECT_NAME" --branch company/libraside-technologies --commit-dirty=true

      - name: Attach apex and www domains
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          current="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          jq -e '.success == true' <<<"$current" >/dev/null
          for domain in "$COMPANY_DOMAIN" "$COMPANY_WWW_DOMAIN"; do
            if jq -e --arg domain "$domain" '.result[]? | select(.name == $domain)' <<<"$current" >/dev/null; then
              echo "$domain is already attached."
            else
              created="$(curl --fail --silent --show-error "${auth[@]}" -X POST "$api" --data "{\"name\":\"$domain\"}")"
              jq -e '.success == true' <<<"$created" >/dev/null
              echo "Attached $domain."
            fi
          done

      - name: Ensure apex and www DNS
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          target="$PROJECT_NAME.pages.dev"
          for name in "$COMPANY_DOMAIN" "$COMPANY_WWW_DOMAIN"; do
            response="$(curl --fail --silent --show-error "${auth[@]}" "$api?name=$name&per_page=100")"
            jq -e '.success == true' <<<"$response" >/dev/null
            record_id="$(jq -r '.result[]? | select(.type == "CNAME") | .id' <<<"$response" | head -n 1)"
            body="$(jq -nc --arg name "$name" --arg content "$target" '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')"
            if [ -n "$record_id" ]; then
              changed="$(curl --fail --silent --show-error "${auth[@]}" -X PUT "$api/$record_id" --data "$body")"
            else
              conflicting="$(jq -r '.result[0].id // empty' <<<"$response")"
              if [ -n "$conflicting" ]; then
                echo "::error::$name already has a non-CNAME record. Review it before replacement."
                exit 1
              fi
              changed="$(curl --fail --silent --show-error "${auth[@]}" -X POST "$api" --data "$body")"
            fi
            jq -e '.success == true' <<<"$changed" >/dev/null
          done

      - name: Enable Cloudflare Email Routing
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          api="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/email/routing/dns"
          current="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          jq -e '.success == true' <<<"$current" >/dev/null
          if jq -e '.result.enabled == true' <<<"$current" >/dev/null; then
            echo 'Email Routing is already enabled.'
          else
            body="$(jq -nc --arg name "$COMPANY_DOMAIN" '{name:$name}')"
            enabled="$(curl --fail --silent --show-error "${auth[@]}" -X POST "$api" --data "$body")"
            jq -e '.success == true' <<<"$enabled" >/dev/null
            echo 'Enabled Email Routing and its required MX/SPF records.'
          fi

      - name: Verify the forwarding destination
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses"
          addresses="$(curl --fail --silent --show-error "${auth[@]}" "$api?per_page=50")"
          jq -e '.success == true' <<<"$addresses" >/dev/null
          destination="$(jq -c --arg email "$DESTINATION_EMAIL" '.result[]? | select((.email | ascii_downcase) == ($email | ascii_downcase))' <<<"$addresses" | head -n 1)"
          if [ -z "$destination" ]; then
            created="$(curl --fail --silent --show-error "${auth[@]}" -X POST "$api" --data "$(jq -nc --arg email "$DESTINATION_EMAIL" '{email:$email}')")"
            jq -e '.success == true' <<<"$created" >/dev/null
            destination="$(jq -c '.result' <<<"$created")"
            echo "Cloudflare sent a destination-verification message to $DESTINATION_EMAIL."
          fi
          verified="$(jq -r '.verified // empty' <<<"$destination")"
          if [ -z "$verified" ]; then
            echo "::error::$DESTINATION_EMAIL must approve Cloudflare's destination-verification email before forwarding can be activated."
            exit 1
          fi
          echo 'The forwarding destination is verified.'

      - name: Route the company address to the existing inbox
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          api="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/email/routing/rules"
          rules="$(curl --fail --silent --show-error "${auth[@]}" "$api?per_page=50")"
          jq -e '.success == true' <<<"$rules" >/dev/null
          rule_id="$(jq -r --arg email "$COMPANY_EMAIL" '.result[]? | select(any(.matchers[]?; .type == "literal" and .field == "to" and ((.value | ascii_downcase) == ($email | ascii_downcase)))) | .id' <<<"$rules" | head -n 1)"
          body="$(jq -nc --arg source "$COMPANY_EMAIL" --arg destination "$DESTINATION_EMAIL" '{name:"Libra Side Technologies founder inbox",enabled:true,priority:0,source:"api",matchers:[{type:"literal",field:"to",value:$source}],actions:[{type:"forward",value:[$destination]}]}')"
          if [ -n "$rule_id" ]; then
            result="$(curl --fail --silent --show-error "${auth[@]}" -X PUT "$api/$rule_id" --data "$body")"
            echo 'Updated the existing company-email rule.'
          else
            result="$(curl --fail --silent --show-error "${auth[@]}" -X POST "$api" --data "$body")"
            echo 'Created the company-email rule.'
          fi
          jq -e '.success == true' <<<"$result" >/dev/null

      - name: Verify both public hostnames
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://$COMPANY_DOMAIN/" "https://$COMPANY_WWW_DOMAIN/"; do
            verified='false'
            for attempt in $(seq 1 24); do
              page="$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 "$url" || true)"
              if grep -Fq 'Libra Side Technologies' <<<"$page" && grep -Fq 'Better,' <<<"$page"; then
                echo "$url serves the company site."
                verified='true'
                break
              fi
              sleep 10
            done
            test "$verified" = 'true' || {
              echo "::error::$url did not become publicly verifiable during this run."
              exit 1
            }
          done
