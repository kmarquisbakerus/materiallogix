name: Polish MaterialLogix product site
on:
  push:
    paths:
      - '.github/workflows/polish-product-site.yml'
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refine public-facing copy and brand styling
        run: |
          python - <<'PY'
          from pathlib import Path

          # Company name is one word everywhere in customer-facing text.
          text_ext = {'.html','.js','.css','.md','.txt','.json','.webmanifest','.yml','.yaml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              n = s.replace('Libra Side Technologies LLC','LibraSide Technologies LLC')
              n = n.replace('Libra Side Technologies, LLC','LibraSide Technologies LLC')
              n = n.replace('LibraSide Technologies, LLC','LibraSide Technologies LLC')
              if n != s:
                  p.write_text(n)

          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '<title>MaterialLogix Studio — free local creative studio</title>':'<title>MaterialLogix — creative review, voice, and campaign production</title>',
            '<meta name="description" content="Review, refine, and package AI-assisted photos, video, and voice locally. Free preview access is open now.">':'<meta name="description" content="Review, refine, and deliver AI-assisted photo, video, and voice work in a local-first creative studio.">',
            '<span class="eyebrow">Free preview access is open</span>':'<span class="eyebrow">MaterialLogix Studio</span>',
            '<p>Review, refine, and package AI-assisted photos, video, and voice in one local-first studio. The public version available right now is free and runs on your own machine.</p>':'<p>A local-first creative workspace for reviewing, refining, and delivering photo, video, and voice. Your work stays on your machine until you choose otherwise.</p>',
            '>Open the free Studio<':'>Open Studio<',
            '>Explore the demo<':'>View Demo<',
            '<div class="fine">The demo is the current Studio interface in an isolated demo workspace — not the old beta site.</div>':'<div class="fine">Local-first workflow · supplied brand assets remain reference-only · originals stay untouched.</div>',
            '<span class="eyebrow">Available now</span><h2>The real workflow, free first.</h2><p class="sub">This is not a countdown trial. You can use the local MaterialLogix preview lane now. Free exports stay visibly or audibly watermarked, and cloud rendering, clean paid exports, and subscriptions remain disabled until the production backend is fully tested.</p>':'<span class="eyebrow">Studio access</span><h2>Start with the workflow.</h2><p class="sub">Review, prepare, and test creative work locally today. Preview exports are clearly marked so they stay separate from final licensed deliverables. Paid cloud services will appear when production billing is available.</p>',
            '<span class="eyebrow">Current demo, automatically</span><h3>One app. One interface. No stale demo fork.</h3><p>The website demo now opens the same Studio application code as the live free product, with a separate demo database. When the app UI changes, the demo changes with it instead of falling behind.</p>':'<span class="eyebrow">One product</span><h3>One interface, always current.</h3><p>The demo and Studio share the same product foundation, so what you see reflects the current MaterialLogix experience rather than a separate showcase build.</p>',
            '<span class="eyebrow">Privacy by architecture</span><h2>Free means local.</h2>':'<span class="eyebrow">Privacy by architecture</span><h2>Your work stays yours.</h2>',
            '<p class="sub">Photos, video, voice references, and likeness data stay on the customer side in the free workflow. Imported logos and marks are reference assets only; MaterialLogix does not generate or redesign them.</p>':'<p class="sub">Photos, video, voice references, and likeness data remain on the customer side in the local workflow. Imported logos and marks are reference assets only; MaterialLogix does not generate or redesign them.</p>'
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          # Refine the visual system without changing the established direction.
          s=s.replace('.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--hair-soft);border:1px solid var(--hair-soft)}.card{background:var(--panel);padding:34px 30px}',
                      '.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;background:transparent;border:0}.card{background:linear-gradient(145deg,rgba(24,24,27,.78),rgba(14,14,16,.72));padding:34px 30px;border:1px solid rgba(255,255,255,.07);border-radius:22px;backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 22px 60px rgba(0,0,0,.16)}')
          s=s.replace('.band{background:var(--gold-wash);border:1px solid rgba(201,168,106,.2);padding:44px 40px}',
                      '.band{background:linear-gradient(145deg,rgba(201,168,106,.10),rgba(255,255,255,.025));border:1px solid rgba(201,168,106,.18);padding:44px 40px;border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}')
          s=s.replace('.btn{display:inline-block;padding:11px 22px;border:1px solid var(--hair);font-size:13.5px;transition:160ms var(--ease)}',
                      '.btn{display:inline-block;padding:11px 22px;border:1px solid rgba(255,255,255,.10);border-radius:999px;font-size:13.5px;transition:160ms var(--ease);background:rgba(255,255,255,.025);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}')
          s=s.replace('.btn.primary{background:linear-gradient(180deg,#d8b878,var(--gold) 55%,#b8955a);color:#16120a;border-color:rgba(255,255,255,.25);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 14px rgba(201,168,106,.22)}',
                      '.btn.primary{background:linear-gradient(180deg,#d8b878,var(--gold) 55%,#b8955a);color:#16120a;border-color:rgba(255,255,255,.25);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 26px rgba(201,168,106,.18)}')
          p.write_text(s)

          # Make the legal footer/company reference consistent if generated JS is present.
          p=Path('legal/site.js')
          if p.exists():
              s=p.read_text().replace('Libra Side Technologies LLC','LibraSide Technologies LLC')
              p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Polish MaterialLogix public experience'
          git push
