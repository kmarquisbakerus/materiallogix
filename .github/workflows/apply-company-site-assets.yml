name: Apply Libra Side Technologies brand assets

on:
  push:
    branches:
      - company/libraside-technologies
    paths:
      - .github/workflows/apply-company-site-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: company/libraside-technologies

      - name: Download approved product visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p company-site/media .asset-work
          curl --fail --location --retry 3 --silent --show-error \
            'https://sideof.app/campaign/site/social-light-festival-landing.png' \
            --output .asset-work/sideof-social.png
          curl --fail --location --retry 3 --silent --show-error \
            'https://sideof.app/campaign/site/dating-dmv-waterfront-walk.png' \
            --output .asset-work/sideof-dating.png
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/kmarquisbakerus/materiallogix/main/media/studio-photo.webp' \
            --output company-site/media/studio-photo.webp
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/kmarquisbakerus/materiallogix/main/media/photo-matrix-deep-skin-linen-daylight.jpg' \
            --output .asset-work/fashion-maker.jpg

      - name: Optimize the photographic assets
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            image_tool='magick'
          elif command -v convert >/dev/null 2>&1; then
            image_tool='convert'
          else
            python -m pip install --disable-pip-version-check --quiet pillow
            python - <<'PY'
          from PIL import Image
          from pathlib import Path
          jobs = [
              ('.asset-work/sideof-social.png', 'company-site/media/sideof-social.webp', 1600),
              ('.asset-work/sideof-dating.png', 'company-site/media/sideof-dating.webp', 1400),
              ('.asset-work/fashion-maker.jpg', 'company-site/media/fashion-maker.webp', 1400),
          ]
          for source, destination, maximum in jobs:
              with Image.open(source) as image:
                  image = image.convert('RGB')
                  if image.width > maximum:
                      image.thumbnail((maximum, maximum * 4), Image.Resampling.LANCZOS)
                  image.save(destination, 'WEBP', quality=86, method=6)
          PY
            rm -rf .asset-work
            exit 0
          fi
          "$image_tool" .asset-work/sideof-social.png -auto-orient -resize '1600x>' -strip -quality 86 company-site/media/sideof-social.webp
          "$image_tool" .asset-work/sideof-dating.png -auto-orient -resize '1400x>' -strip -quality 86 company-site/media/sideof-dating.webp
          "$image_tool" .asset-work/fashion-maker.jpg -auto-orient -resize '1400x>' -strip -quality 86 company-site/media/fashion-maker.webp
          rm -rf .asset-work

      - name: Validate the investor-site package
        shell: bash
        run: |
          set -euo pipefail
          test -s company-site/index.html
          test -s company-site/styles.css
          test -s company-site/site.js
          for file in \
            company-site/media/sideof-social.webp \
            company-site/media/sideof-dating.webp \
            company-site/media/studio-photo.webp \
            company-site/media/fashion-maker.webp; do
            test -s "$file"
            test "$(stat -c%s "$file")" -lt 650000
          done
          ! grep -Eq 'console-index|console-row|portfolio-console|item-number|statement-number|wordmark-mark|founder-monogram|>0[1-9]<' company-site/index.html
          ! grep -Eq 'font-style:[[:space:]]*italic' company-site/styles.css
          grep -Fq 'Better tools.' company-site/index.html
          grep -Fq 'Black-founded in Washington, DC' company-site/index.html
          grep -Fq 'The parent company shares standards—not user contexts.' company-site/index.html

      - name: Remove this one-time workflow and commit the assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-company-site-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-site .github/workflows/apply-company-site-assets.yml
          git commit -m 'Add real product and people imagery to the parent site'
          git push origin HEAD:company/libraside-technologies
