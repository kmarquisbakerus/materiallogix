name: Activate MaterialLogix checkout entry

on:
  push:
    paths:
      - .github/workflows/activate-checkout-entry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Add the production checkout module to the homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          homepage = Path('index.html')
          source = homepage.read_text(encoding='utf-8')
          tag = '<script type="module" src="checkout-site.js?v=20260902"></script>'
          if tag not in source:
              if '</body>' not in source:
                  raise SystemExit('index.html has no closing body tag')
              source = source.replace('</body>', f'{tag}\n</body>', 1)
              homepage.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/activate-checkout-entry.yml')
          workflow.unlink(missing_ok=True)
          PY
      - name: Commit the one-time activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/activate-checkout-entry.yml
          git diff --cached --quiet && exit 0
          git commit -m "Load MaterialLogix checkout controls on the homepage"
          git push origin HEAD:main
