name: Apply upright hero emphasis

on:
  push:
    branches:
      - style/upright-hero-emphasis
    paths:
      - '.github/workflows/apply-upright-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: style/upright-hero-emphasis
          fetch-depth: 0
      - name: Replace the display italic with upright emphasis
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.hero h1 em{font-style:italic;color:var(--gold)}'
          new = '.hero h1 em{font-style:normal;color:var(--gold)}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one hero italic rule, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Verify the correction is limited
        shell: bash
        run: |
          set -euo pipefail
          grep -F '.hero h1 em{font-style:normal;color:var(--gold)}' index.html
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'index.html'
      - name: Commit the typography correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use upright emphasis in the MaterialLogix hero'
          git push origin HEAD:style/upright-hero-emphasis
