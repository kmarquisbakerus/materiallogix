<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MaterialLogix Studio — review, refine, and ship</title>
<meta name="description" content="The judgment layer for AI-assisted campaign assets. Import, review, refine, approve, and package photo, video, voice, and supplied brand assets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('cros:theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})()</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="btn sm" type="button" id="menuBtn" aria-label="Open project settings">☰</button>
    <div class="brand">
      <strong>Review</strong>
      <span>MaterialLogix</span>
    </div>
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../">MaterialLogix</a><span>/</span><a href="./">Studio</a><span>/</span><b>Review</b></nav>
    <select id="projectSelect" aria-label="Project"></select>
    <button class="btn sm" type="button" id="newProject">New</button>
    <div class="spacer"></div>
    <div class="counters" id="counters" role="status" aria-live="polite" aria-label="Project totals"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="review" class="on">Review</button>
      <button data-mode="board">Board</button>
    </div>
    <button class="btn sm" type="button" id="themeBtn" aria-label="Switch light and dark theme" title="Light / dark">◐</button>
    <button class="btn sm" type="button" id="helpBtn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
    <button class="btn primary" id="exportBtn">Export package</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Project settings"></aside>
    <main class="stage-wrap" id="main"></main>
    <aside class="activity-rail" id="activityRail" aria-label="Jobs, execution location, progress, and usage"></aside>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*,video/*" hidden>
<input type="file" id="brandAssetInput" multiple accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" hidden>
<input type="file" id="verdictInput" accept="application/json,.json" hidden>

<dialog id="dlg">
  <div class="dlg-head" id="dlgTitle"></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>

<script type="module" src="js/activity.js"></script>
<script type="module" src="js/bootstrap.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
