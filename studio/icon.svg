<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">MaterialLogix</title>
  <desc id="desc">The ML monogram in the gleam, on the house ground.</desc>
  <!-- The monogram as outlines rather than as text. An SVG icon cannot pull a
       webfont, so set as text this mark arrived in whatever serif the reader
       happened to have - a different letterform from the one
       brand/gleam-sheet.html draws, on almost every machine that opened it.
       These are that sheet's own letters, Fraunces italic, taken to paths, with
       its own gradient stops. It now looks the same everywhere. -->
  <linearGradient id="gleam" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#7a5423"/>
    <stop offset="16%" stop-color="#b98232"/>
    <stop offset="36%" stop-color="#e3c98b"/>
    <stop offset="50%" stop-color="#c49a4e"/>
    <stop offset="60%" stop-color="#ecd9a0"/>
    <stop offset="80%" stop-color="#a8752e"/>
    <stop offset="92%" stop-color="#d3b26c"/>
    <stop offset="100%" stop-color="#7d5825"/>
  </linearGradient>
  <rect width="96" height="96" rx="16.5" fill="#0a0a0b"/>
