<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">MaterialLogix</title>
  <desc id="desc">The ML monogram in the gleam, on the house ground.</desc>
  <!-- The monogram as outlines rather than as text. An SVG icon cannot pull a
       webfont - a font-face inside an image is not fetched by the browsers that
       draw it as a favicon or a manifest icon - so set as text this mark arrived
       in whatever serif the reader happened to have, which for most of them was
       not Fraunces at all.

       These are Fraunces Italic's own contours, at the optical size this tile
       calls for, and every number is brand/gleam-sheet.html's tile rule rather
       than a value chosen by eye: the ground, the 16.512 radius and the 0.03
       scale are `body.tile .stage` and its font-size of 96 * .625 over the
       face's 2000 units; 1607 is M's advance of 1647 plus the -.02em tracking;
       and the translate is where justify-content and align-items put that run's
       origin. Regenerate from the sheet if the sheet changes. -->
  <linearGradient id="gleam" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#7a5423"/>
    <stop offset="16%" stop-color="#b98232"/>
    <stop offset="36%" stop-color="#e3c98b"/>
    <stop offset="50%" stop-color="#c49a4e"/>
    <stop offset="60%" stop-color="#ecd9a0"/>
    <stop offset="80%" stop-color="#a8752e"/>
    <stop offset="92%" stop-color="#d3b26c"/>
    <stop offset="100%" stop-color="#7d5825"/>
  </linearGradient>
  <rect width="96" height="96" rx="16.512" fill="#0a0a0b"/>
  <g fill="url(#gleam)" transform="translate(8.295 69.69) scale(0.03 -0.03)">
