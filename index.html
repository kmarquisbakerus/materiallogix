<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaterialLogix</title>
<meta name="description" content="MaterialLogix Studio — the judgment layer for AI-made campaigns. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0a0b;--ink:#eeebe4;--gold:#c9a86a;--gold-dim:#8a7444;--muted:#8b857c;--faint:#5e5a54}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(900px 500px at 70% -5%,rgba(214,140,90,.07),transparent 60%),var(--ground);
color:var(--ink);font:300 15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:40px 24px}
.mark{font:italic 300 clamp(90px,22vw,170px)/0.9 Fraunces,Georgia,serif;letter-spacing:-.06em;user-select:none}
.mark .m{color:var(--ink)}
.mark .l{color:var(--gold);margin-left:-.28em;display:inline-block;transform:translateY(.14em)}
.rule{width:min(300px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:34px 0}
h1{font:400 11px/1 Inter,sans-serif;letter-spacing:.5em;text-transform:uppercase;color:var(--ink);margin-bottom:14px}
p.tag{color:var(--muted);max-width:44ch;font-size:14px}
.soon{margin-top:34px;font:400 10px/1 Inter,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.official{margin-top:52px;font-size:12px;color:var(--faint)}
.official a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--gold-dim);padding-bottom:1px}
.official span{margin:0 10px}
footer{position:fixed;bottom:22px;left:0;right:0;font-size:11px;color:var(--faint)}
</style>
</head>
<body>
  <div class="mark" aria-label="MaterialLogix monogram"><span class="m">M</span><span class="l">L</span></div>
  <div class="rule"></div>
  <h1>Material<span style="color:var(--gold)">Logix</span></h1>
  <p class="tag">The judgment layer for AI-made campaigns. Photos, video, and voice — reviewed like a creative director, measured like an engineer.</p>
  <p class="soon">Coming soon</p>
  <p class="official">Official accounts: <span>@materiallogix</span> · <a href="mailto:admin@materiallogix.com">admin@materiallogix.com</a></p>
  <footer>© 2026 MaterialLogix Studio</footer>
</body>
</html>
