<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a0a0b">
  <title>MaterialLogix Studio — launch preparation</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background: radial-gradient(circle at 50% 0, #272016 0, #0a0a0b 42%); color: #eeebe4; }
    main { width: min(680px, 100%); border: 1px solid #2d2922; background: rgba(16,16,17,.92);
      padding: clamp(34px, 7vw, 72px); box-shadow: 0 30px 90px rgba(0,0,0,.38); }
    .mark { color: #c9a86a; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 24px 0 18px; font-family: Georgia, serif; font-weight: 400;
      font-size: clamp(40px, 8vw, 72px); line-height: .98; }
    p { margin: 0; max-width: 54ch; color: #b6b1a8; font-size: 17px; line-height: 1.7; }
    a { display: inline-block; margin-top: 34px; color: #e4c78e; text-underline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MaterialLogix Studio</div>
    <h1>Preparing the complete release.</h1>
    <p>We are completing product, quality, security, accessibility, and delivery acceptance before reopening public access. MaterialLogix Studio will return when the release is ready to stand behind.</p>
    <a href="mailto:admin@materiallogix.com?subject=MaterialLogix%20Studio%20launch">Contact MaterialLogix</a>
  </main>
